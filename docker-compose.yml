services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: pnj-international:latest
    container_name: pnj-portal
    restart: unless-stopped
    ports:
      # host:container — ubah sisi kiri bila port 3000 di VPS sudah dipakai
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      # Data demo (JSON store) tetap hidup walau container dibuat ulang.
      # Tanpa volume ini, semua pengajuan hilang setiap kali deploy.
      - portal-data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  portal-data:
